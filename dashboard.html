<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- Header Navbar -->
    <nav class="navbar  navbar-expand-lg bg-body-tertiary header-section d-flex justify-content-between align-items-center px-3 mb-4 shadow-sm">   
        <div class="container-fluid ">
            <a class="navbar-brand app-title fs-4" href="#">FinLogger</a>
            <span class="navbar-text app-tagline">Your financial diary!</span>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Row 1: Header / Overview -->
        <div class="row align-items-center mb-4 g-3">
            <!-- Changed col-6 to col-12 col-md-6 for mobile stacking -->
            <div class="col-12 col-md-6 d-flex align-items-center">
                <h1 class="h3 fw-bold mb-0">OVERVIEW</h1>
            </div>
            <!-- Adjusted alignment and wrapping for mobile -->
            <div class="col-12 col-md-6 d-flex justify-content-md-end justify-content-between align-items-center gap-2 flex-wrap">
                <input type="date" id="monthFilter" class="form-control flex-grow-1 flex-md-grow-0 w-auto"/>
                <button class="btn btn-primary px-3 text-nowrap expButton" data-bs-toggle="modal" data-bs-target="#modal">
                    Add Expense
                </button>
            </div>   
        </div>
        <!-- Modal -->
        <div class="modal fade" id="modal" tabindex="-1" inertia-hidden="true" aria-labelledby="modalTitle" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fs-5" id="modalTitle"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="expenseForm">
                            <label for="date">Date</label>
                            <input type="date" class="form-control" id="date" required>
                            <label for="category">Category</label>
                            <select class="form-control" id="category">
                                <option value="">--Select Category--</option>
                            </select>
                            <label for="description">Description</label>
                            <input type="text" class="form-control" id="description" placeholder="Enter description">
                            <label for="amount">Amount</label>
                            <input type="number" class="form-control" id="amount" placeholder="Enter amount">
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary"  id="expense-submit-btn">Submit</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Delete Expense Modal -->
        <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModal" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fs-5" id="deleteModal">Delete Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                    <p class="mb-0">Are you sure you want to delete this expense?</p>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger">Delete</button>
                </div>
                </div>
            </div>
        </div>
        <!-- Expense Overview Cards -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
               <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="me-3">
                                <!-- Icon -->
                                <img src="./images/spending.png" class="img-fluid" width="40" height="40" alt="Expenses"/>
                            </div>
                            <div>
                                <!-- Text -->
                                <p class="card-text text-muted mb-0 small">Expenses</p>
                                <h5 class="card-title fw-bold mb-0 text-dark" id="totalExpenses"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Monthly Income Card -->
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="me-3">
                                <!-- Icon -->
                                <img src="./images/income.png" class="img-fluid" width="40" height="40" alt="Monthly Income"/>
                            </div>
                            <div>
                                <!-- Text -->
                                <p class="card-text text-muted mb-0 small">Monthly Income</p>
                                <h5 class="card-title fw-bold mb-0 text-dark" id="totalIncome"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Balance Card -->
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="me-3">
                                <!-- Icon -->
                                <img src="./images/balance.png" class="img-fluid" width="40" height="40" alt="Balance"/>
                            </div>
                            <div>
                                <!-- Text -->
                                <p class="card-text text-muted mb-0 small">Balance</p>
                                <h5 class="card-title fw-bold mb-0 text-dark" id="totalBalance"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Row 3: Tables Section (Summary: 4 cols, Details: 8 cols) -->
        <div class="row g-4">
            <!-- Expense Summary Table (4 columns) -->
            <div class="col-lg-4">
                <h4 class="h5 mb-3 fw-bold">Expense Summary</h4>
                <div class="table-responsive table-container border rounded shadow-sm">
                    <table id="expense-summary" class="table border">
                        <thead>
                            <tr>
                                <th>EXPENSE CATEGORY</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Expense Details Table (8 columns) -->
            <div class="col-lg-8">
                <h4 class="h5 mb-3 fw-bold">Expense Details</h4>
                <div class="table-responsive table-container border rounded shadow-sm">
                    <table id="expense-details" class="table border">
                        <thead>
                            <tr>
                                <th>DATE</th>
                                <th>CATEGORY</th>
                                <th>AMOUNT</th>
                                <th>DESCRIPTION</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>    
                </div>
            </div>        
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> 

    <!-- JavaScript -->
    <script src="script.js"></script>

    <!-- Data.js -->
    <script src="data.js"></script>
</body>
</html>
